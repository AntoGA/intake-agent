# Добавить ВНУТРЬ существующего HTTPS server{} для cc-c.ru.
# Не заменять существующий server{}, CSP и маршрут /api/contact.
location = /projects/intake-agent {
    return 301 /projects/intake-agent/;
}
location ^~ /projects/intake-agent/ {
    alias /var/www/cc-intake-agent-public/;
    index index.html;
    autoindex off;
    limit_except GET HEAD { deny all; }
}
# Backend 127.0.0.1:8010 не проксируется публично.
